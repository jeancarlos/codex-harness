[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-jig"
dynamic = ["version"]
description = "Personal harness core for Codex and Claude Code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/jeancarlos/code-jig"

[project.scripts]
code-jig = "codejig.__main__:main"
cjig = "codejig.__main__:main"

[tool.hatch.version]
path = "codejig/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["codejig"]
