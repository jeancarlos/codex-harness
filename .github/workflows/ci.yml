name: ci
on: [push, pull_request, workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        shell: bash
        run: |
          if python -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then durations="--durations 10"; else durations=""; fi
          python -m unittest discover -s tests -v $durations 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: unit summary
        if: always()
        shell: bash
        run: |
          {
            echo "### unit: $RUNNER_OS, Python $(python -V | cut -d' ' -f2)"
            echo '```'
            grep -E '^(Ran |OK|FAILED)' "$RUNNER_TEMP/unit.log" || echo "no result line"
            grep -A11 'Slowest test durations' "$RUNNER_TEMP/unit.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: install smoke
        shell: bash
        run: |
          python -m codejig --overlay overlay-examples/personal --codex-home "$RUNNER_TEMP/codex home" install
          head -n 1 "$RUNNER_TEMP/codex home/AGENTS.md" | grep -q '^<!-- generated by code-jig'
  codex-keys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix ci/npm --ignore-scripts
      - name: doctor --check-binary
        shell: bash
        run: |
          bin=$(find "ci/npm/node_modules/@openai" -type f \( -name codex -o -name codex.exe \) -size +10M | head -1)
          echo "native binary: $bin"
          python -m codejig doctor --check-binary --codex-bin "$bin"
      - name: execpolicy example and full doctor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bin=$(find "ci/npm/node_modules/@openai" -type f -name codex -size +10M | head -1)
          "$bin" execpolicy check --rules overlay-examples/personal/rules/toolchain.rules git push --force origin main | grep -q '"decision":"forbidden"'
          test "$("$bin" execpolicy check --rules overlay-examples/personal/rules/toolchain.rules git push origin main)" = '{"matchedRules":[]}'
          home="$RUNNER_TEMP/codex home"
          python -m codejig --overlay overlay-examples/personal --codex-home "$home" install
          python -m codejig --overlay overlay-examples/personal --codex-home "$home" doctor --codex-bin "$bin"
  analyze-real:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r ci/analyze.txt
      - run: npm ci --prefix ci/npm --ignore-scripts
      - shell: bash
        run: echo "$PWD/ci/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: ruff
        if: runner.os == 'Linux'
        run: ruff check codejig tests .github/scripts
      - name: gitleaks and osv-scanner (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz -C bin gitleaks
          curl -sSL -o "$RUNNER_TEMP/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks and osv-scanner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -OutFile (Join-Path $bin "gl.zip")
          Expand-Archive (Join-Path $bin "gl.zip") -DestinationPath $bin
          Invoke-WebRequest https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_windows_amd64.exe -OutFile (Join-Path $bin "osv-scanner.exe")
          Add-Content $env:GITHUB_PATH $bin
      - name: real tools
        env:
          CODE_JIG_REAL_TOOLS: "1"
        run: python -m unittest tests.test_analyze -v
      - name: analyze and trace run clean on this repo
        shell: bash
        run: |
          python -m codejig analyze --json > "$RUNNER_TEMP/analyze.json" || test $? -eq 1
          python -c "import json, sys; d = json.load(open(sys.argv[1], encoding='utf-8')); assert d['errors'] == [], d['errors']; assert 'python' in d['stacks']; print(len(d['findings']), 'findings')" "$RUNNER_TEMP/analyze.json"
          printf '999999\n' > "$RUNNER_TEMP/ids.txt"
          python -m codejig trace "$RUNNER_TEMP/ids.txt" --json > "$RUNNER_TEMP/trace.json" || test $? -eq 1
          python -c "import json, sys; d = json.load(open(sys.argv[1], encoding='utf-8')); assert d['missing'] == ['999999'], d" "$RUNNER_TEMP/trace.json"
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r ci/coverage.txt
      - name: measure
        id: measure
        run: |
          coverage run --branch --include='codejig/*' -m unittest discover -s tests -t .
          coverage report --format=total > percent.txt
          {
            echo "### coverage"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          coverage report --fail-under=93
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-percent
          path: percent.txt
  lint-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix ci/npm
      - run: ci/npm/node_modules/.bin/agnix .
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r ci/reuse.txt
      - run: reuse lint
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r ci/build.txt
      - name: wheel tests
        run: python -m unittest tests.test_wheel -v
      - run: python .github/scripts/build_wheel.py "v$(python -c 'from codejig import VERSION; print(VERSION)')" "$RUNNER_TEMP/dist"
      - run: python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: init-overlay, install and doctor from the wheel
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex" CODE_JIG_SKILLS_DIR="$RUNNER_TEMP/skills" XDG_DATA_HOME="$RUNNER_TEMP/data"
          "$RUNNER_TEMP/venv/bin/code-jig" init-overlay "$RUNNER_TEMP/overlay"
          sed -i 's/^core_writable = true$/core_writable = false/' "$RUNNER_TEMP/overlay/overlay.toml"
          "$RUNNER_TEMP/venv/bin/code-jig" --overlay "$RUNNER_TEMP/overlay" install
          "$RUNNER_TEMP/venv/bin/code-jig" --overlay "$RUNNER_TEMP/overlay" doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "^ok core pin: v" "$RUNNER_TEMP/doctor.txt"
          grep -q "^ok core clean: matches its release digest" "$RUNNER_TEMP/doctor.txt"
