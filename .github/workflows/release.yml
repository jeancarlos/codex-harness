name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: wheel
        run: |
          python -m pip install --require-hashes -r ci/build.txt
          python .github/scripts/build_wheel.py "$GITHUB_REF_NAME" dist
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/code-jig.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: sums
        run: cd dist && sha256sum -- *.whl code-jig.spdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/code-jig.spdx.json
            dist/SHA256SUMS
      - name: provenance asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/code-jig.intoto.jsonl
      - name: summary
        run: |
          {
            echo "### release assets"
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-rc*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $pre
  pypi:
    needs: publish
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/code-jig
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: download the released wheel and check it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release --pattern '*.whl' --pattern SHA256SUMS
          cd release
          set -- *.whl
          test "$#" -eq 1
          gh attestation verify "$1" --repo jeancarlos/code-jig
          grep -F "  $1" SHA256SUMS | sha256sum --strict -c -
          mkdir ../dist
          mv -- "$1" ../dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
